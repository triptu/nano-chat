name: Release

# A pushed tag v1.2.3 builds the signed APK and publishes it as that tag's GitHub Release, with the tag's message as
# its notes. .claude/skills/release cuts the tag.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The release key's certificate. The build fails rather than publish an APK signed with any other key.
      EXPECTED_CERT: 25:89:E1:4D:30:EA:5B:B1:B4:00:49:1D:4B:BD:1A:C5:09:C2:DA:0D:7E:2B:65:7D:6B:3B:03:57:08:12:AA:40
    steps:
      - uses: actions/checkout@v7
      - name: Fetch the tag with its message
        run: git fetch --force origin "+refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
      - name: Check the version name matches the tag
        run: grep -q "versionName = \"${GITHUB_REF_NAME#v}\"" app/build.gradle.kts
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
        with:
          # Only tags run this workflow, so let them write the cache
          cache-read-only: false
      - name: Decode the release key
        env:
          KEYSTORE_BASE64: ${{ secrets.NANOCHAT_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "NANOCHAT_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Test and build
        env:
          NANOCHAT_KEYSTORE_PASSWORD: ${{ secrets.NANOCHAT_KEYSTORE_PASSWORD }}
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=nano-chat.apk
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          cert=$("$apksigner" verify --print-certs "$apk" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1 \
            | tr a-f A-F | sed 's/../&:/g; s/:$//')
          if [ "$cert" != "$EXPECTED_CERT" ]; then echo "Signed with $cert, expected $EXPECTED_CERT"; exit 1; fi
          {
            git for-each-ref "refs/tags/$GITHUB_REF_NAME" --format='%(contents)'
            echo
            echo "### Check the download"
            echo
            echo "- \`$apk\` SHA-256: \`$(sha256sum "$apk" | cut -d' ' -f1)\`"
            echo "- Signing certificate SHA-256: \`$cert\`"
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" "$apk" --title "Nano Chat ${GITHUB_REF_NAME#v}" --notes-file "$RUNNER_TEMP/notes.md"
